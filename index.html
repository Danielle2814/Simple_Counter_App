<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://th.bing.com/th/id/OIP.nZzkSBXBdDdmfuUbXLkTEgHaHa?w=219&h=219&c=7&r=0&o=7&pid=1.7&rm=3" type="image/x-icon">
    <title>Simple Counter App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="w-screen h-screen flex flex-col items-center justify-center bg-transparent">
    <div id="containeur" class="w-3/4 flex flex-col items-center gap-5 border border-gray-300 text-center pb-2 md:w-2/4 md:pb-5 ">

        <!-- Titre de l'application -->
        <h1 id="titre" class="bg-gray-300 w-full text-center text-5xl p-10 font-semibold md:text-6xl"> Counter App</h1>

        <!-- Description de l'application -->
        <p id="description" class="p-3 text-3xl md:text-4xl">This is a simple counter application. Use the buttons Increase, Decrease, or Reset to control the counter.</p>

        <!-- Affichage du compteur -->
        <div id="compteur" class="text-6xl font-bold p-4 md:text-8xl">0</div>

        <!-- Boutons de contrôle -->
        <div id="bouton_containeur" class="flex gap-4 md:text-3xl pt-5">
            <button id="increase" class="bg-[#228B22] hover:bg-green-500 text-white font-semibold py-2 px-4 rounded text-2xl">Increase</button>
            <button id="decrease" class="bg-[#8b0000] hover:bg-[#722f37] text-white font-semibold py-2 px-4 rounded text-2xl">Decrease</button>
            <button id="reset" class="bg-black hover:bg-gray-800 text-white font-semibold py-2 px-4 rounded text-2xl">Reset</button>
        </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
